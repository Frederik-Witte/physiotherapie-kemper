                label: Qualifikationen
                label_singular: Qualifikation
                widget: list
                required: false
                hint: 'Erscheinen als kleine Kästchen unter der Funktion. Eine Qualifikation pro Zeile, z. B. „Manuelle Therapie“ – bitte nur abgeschlossene Fortbildungen.'
              - name: foto
