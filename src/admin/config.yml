              - name: qualifikationen
                label: Qualifikationen
                label_singular: Qualifikation
                widget: list
                required: false
                hint: 'Erscheinen als kleine Kästchen unter der Funktion. Eine pro Zeile, z. B. „Bobath-Therapeutin“ – bitte nur abgeschlossene Fortbildungen.'
              - name: foto
                label: Foto
                widget: image
                required: false
                choose_url: false
                hint: 'Porträt, hochkant oder quadratisch, mindestens 800 Pixel breit, Gesicht im oberen Teil des Fotos. Wird rund zugeschnitten. Ohne Foto erscheinen die Initialen. Nur mit Einwilligung der Person. Benennen Sie das Foto vor dem Hochladen ohne Nachnamen, z. B. „team-anna-m.jpg“ – Dateinamen sind öffentlich und bleiben in der Versionsgeschichte.'
              - name: text
                label: Kurzvorstellung
                widget: text
                required: false
                hint: 'Ein bis zwei Sätze. Leer lassen = keine Vorstellung.'
              - name: sichtbar
                label: Auf der Website zeigen
                widget: boolean
                default: true
                hint: 'Ausschalten, um eine Person auszublenden, ohne den Eintrag zu löschen – z. B. solange die Einwilligung noch fehlt.'

