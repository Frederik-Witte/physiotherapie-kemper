                pattern: ['^(?:(?:sm|md|lg|xl|2xl):)?(?:(?:object|origin)-\[\d{1,3}(?:\.\d+)?%_\d{1,3}(?:\.\d+)?%\]|object-(?:center|top|bottom|left|right|left-top|left-bottom|right-top|right-bottom)|scale-\[\d(?:\.\d{1,3})?\]|scale-(?:100|105|110|125))(?: +(?:(?:sm|md|lg|xl|2xl):)?(?:(?:object|origin)-\[\d{1,3}(?:\.\d+)?%_\d{1,3}(?:\.\d+)?%\]|object-(?:center|top|bottom|left|right|left-top|left-bottom|right-top|right-bottom)|scale-\[\d(?:\.\d{1,3})?\]|scale-(?:100|105|110|125)))*$', 'Bitte nur Angaben wie object-[50%_50%] oder lg:object-[60%_40%] verwenden, durch Leerzeichen getrennt.']
