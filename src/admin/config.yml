# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
#
# Sveltia CMS – Konfiguration für die Website der Physiotherapie Kemper.
# Die Redaktionsoberfläche liegt unter /admin/ und bearbeitet genau die YAML-Dateien in src/_data/.
# Wichtig: Feldnamen, Verschachtelung und Typen müssen exakt zu den YAML-Dateien passen,
# sonst speichert das CMS Daten in einer Form, die die Vorlagen nicht mehr verstehen.
# Doku: https://sveltiacms.app/en/docs

app_title: Website bearbeiten – Physiotherapie Kemper
logo:
  src: logo.svg

backend:
  name: github
  repo: Frederik-Witte/physiotherapie-kemper
  branch: main
  # Anmeldung mit persönlichem Zugriffstoken (siehe ANLEITUNG.md).
  # Für einen „Mit GitHub anmelden“-Knopf später einen OAuth-Client einrichten (base_url) und „oauth“ ergänzen.
  auth_methods: [token]
  commit_messages:
    create: 'Inhalt angelegt: {{slug}}'
    update: 'Inhalt aktualisiert: {{slug}}'
    delete: 'Inhalt gelöscht: {{slug}}'
    uploadMedia: 'Bild hochgeladen: {{path}}'
    deleteMedia: 'Bild gelöscht: {{path}}'

site_url: https://frederik-witte.github.io/physiotherapie-kemper/
display_url: https://frederik-witte.github.io/physiotherapie-kemper/

# Alle Fotos liegen in src/assets/bilder/ und werden beim Bauen der Website automatisch
# in passende Größen (WebP + JPEG) umgerechnet. In den YAML-Dateien steht der Pfad /assets/bilder/<datei>.
media_folder: src/assets/bilder
public_folder: /assets/bilder
media_libraries:
  default:
    config:
      max_file_size: 26214400 # 25 MB pro Datei (vor der automatischen Verkleinerung)
      slugify_filename: true # „Foto Empfang Ä.jpg“ → „foto-empfang-a.webp“
      transformations:
        # Hochgeladene Fotos (auch iPhone-HEIC) werden im Browser verkleinert und als WebP gespeichert;
        # dabei werden Kamera-Metadaten wie der Aufnahmeort entfernt.
        raster_image:
          format: webp
          quality: 85
          width: 2000
          height: 2000

slug:
  encoding: ascii
  clean_accents: true

# Die Vorschau-Spalte zeigt nur eine Liste der Felder, nicht die echte Website – deshalb aus.
editor:
  preview: false

# Standard für alle Markdown-Felder: nur die Formatierungen, die die Website auch darstellt.
field_defaults:
  richtext:
    buttons: [bold, italic, link, bulleted-list, numbered-list]
    editor_components: []
    modes: [rich_text, raw]

collections:
  - name: inhalte
    label: Inhalte
    label_singular: Inhalt
    icon: edit_document
    description: 'Alle Texte, Fotos und Angaben der Website. Nach dem Speichern ist die Änderung nach etwa 1–2 Minuten online. In vielen Texten können Sie Platzhalter wie {telefon}, {email}, {fax}, {strasse}, {strasse_lang}, {plz}, {ort}, {lage} oder {route} schreiben – sie werden automatisch mit den Angaben aus den „Praxisdaten“ gefüllt.'
    files:
      # ------------------------------------------------------------------ praxis.yml
      - name: praxis
        label: Praxisdaten & Öffnungszeiten
        icon: storefront
        file: src/_data/praxis.yml
        preview_path: /
        fields:
          - name: name
            label: Name der Praxis
            widget: string
            comment: 'Praxisdaten & Kontakt – werden überall auf der Website verwendet.\nIn anderen Texten füllen Platzhalter wie {telefon} {email} {strasse} {lage} diese Angaben automatisch ein.'
            hint: 'Erscheint im Logo, in der Fußzeile und beim Teilen der Seite. Im Logo auf dem Handy steht das erste Wort klein über dem Rest (z. B. „Physiotherapie“ / „Kemper“).'
          - name: rechtsname
            label: Rechtlicher Name
            widget: string
            hint: 'z. B. „Dirk Kemper + Söhne GbR“. Steht in der Fußzeile, im Impressum und in der Datenschutzerklärung.'
          - name: telefon
            label: Telefonnummer (so wie sie angezeigt wird)
            widget: string
            hint: 'z. B. „(0511) 795887“. Wenn Sie die Nummer ändern, passen Sie bitte auch das nächste Feld an.'
          - name: telefon_link
            label: Telefonnummer zum Anrufen
            widget: string
            hint: 'Dieselbe Nummer in internationaler Schreibweise ohne Leerzeichen und ohne die 0 der Vorwahl, z. B. „+49511795887“. Wird für alle Anruf-Knöpfe verwendet.'
            pattern: ['^\+[1-9][0-9]{5,14}$', 'Bitte im Format +49… ohne Leerzeichen, Klammern oder Bindestriche eingeben.']
          - name: fax
            label: Faxnummer
            widget: string
            required: false
            hint: 'Leer lassen, wenn kein Fax angezeigt werden soll.'
          - name: email
            label: E-Mail-Adresse
            widget: string
            type: email
          - name: strasse
            label: Straße und Hausnummer
            widget: string
            hint: 'z. B. „Moosbergstr. 4“. Im Fließtext kann {strasse_lang} verwendet werden – dann wird „str.“ zu „straße“ ausgeschrieben.'
          - name: plz
            label: Postleitzahl
            widget: string
            pattern: ['^[0-9]{5}$', 'Bitte eine fünfstellige Postleitzahl eingeben.']
          - name: ort
            label: Ort
            widget: string
          - name: stadtteil
            label: Stadtteil
            widget: string
            required: false
            hint: 'Erscheint z. B. als „Hannover-Stöcken“ unter dem Logo und bei der Adresse.'
          - name: lage
            label: Lage
            widget: string
            required: false
            hint: 'Kurze Ortsangabe, z. B. „am Stöckener Markt“. Erscheint bei der Adresse und über den Platzhalter {lage} in Texten.'
          - name: routenlink
            label: Link „Route planen“
            widget: string
            type: url
            hint: 'Google-Maps-Link zur Praxis. Wird für alle Knöpfe „Route planen“ verwendet.'
          - name: facebook
            label: Facebook-Seite
            widget: string
            type: url
            required: false
            hint: 'Vollständiger Link (https://…). Leer lassen blendet das Facebook-Symbol in der Fußzeile aus.'
          - name: instagram
            label: Instagram-Profil
            widget: string
            type: url
            required: false
            hint: 'Vollständiger Link (https://…). Leer lassen, solange es kein offizielles Instagram-Profil gibt.'
          - name: oeffnungszeiten
            label: Öffnungszeiten
            label_singular: Zeile
            widget: list
            required: false
            summary: '{{tage}}: {{zeiten}}'
            hint: 'Eine Zeile pro Tag oder Tagesgruppe, in der gewünschten Reihenfolge. Alle Zeilen entfernen = statt der Zeiten erscheint der Ersatztext weiter unten.'
            fields:
              - name: tage
                label: Tage
                widget: string
                hint: 'z. B. „Mo–Do“, „Fr“ oder „Sa & So“.'
              - name: zeiten
                label: Uhrzeit
                widget: string
                required: false
                hint: 'z. B. „07:20–18:00“ (ohne „Uhr“ – das wird bei Bedarf ergänzt). Bei geschlossenen Tagen „geschlossen“. Leer gelassen gilt die Zeile als geschlossen.'
              - name: geschlossen
                label: An diesen Tagen geschlossen
                widget: boolean
                default: false
                hint: 'Einschalten für Tage ohne Sprechzeiten (z. B. das Wochenende). Diese Zeile erscheint dann nur in den ausführlichen Listen, nicht im Menü und in der Fußzeile.'
          - name: termin_hinweis
            label: Hinweis unter den Öffnungszeiten
            widget: string
            required: false
            hint: 'z. B. „Termine nach Vereinbarung“. Erscheint im Menü und in der Fußzeile. Dieselbe Aussage steht auch auf der Startseite unter „Kontakt & Anfahrt“ (Einleitungstext und Text „Termine“) und bei den häufigen Fragen („Wann ist die Praxis geöffnet?“) – bitte dort mit anpassen.'
          - name: ohne_oeffnungszeiten
            label: Ersatztext ohne Öffnungszeiten
            widget: string
            hint: 'Wird anstelle der Öffnungszeiten gezeigt, wenn die Liste oben leer ist, z. B. „Termine nach telefonischer Vereinbarung“.'
          - name: hinweis_banner
            label: Hinweis-Banner (z. B. Urlaub)
            widget: object
            hint: 'Schmale blaue Leiste ganz oben auf allen Seiten – ideal für Urlaubs- oder Feiertagshinweise.'
            fields:
              - name: aktiv
                label: Banner anzeigen
                widget: boolean
                default: false
                hint: 'Einschalten, speichern – nach 1–2 Minuten ist der Hinweis online. Danach wieder ausschalten.'
              - name: text
                label: Text des Hinweises
                widget: string
                required: false
                hint: 'Kurz halten, z. B. „Vom 23.12. bis 02.01. ist unsere Praxis geschlossen.“ Platzhalter wie {telefon} werden automatisch ersetzt.'
          - name: google_bewertung
            label: Google-Bewertung
            widget: object
            hint: 'Kleines Sterne-Abzeichen unter dem Startbild und im Kontaktbereich. Bitte nur echte, aktuelle Werte von Google übernehmen.'
            fields:
              - name: anzeigen
                label: Bewertung anzeigen
                widget: boolean
                default: false
              - name: sterne
                label: Sterne-Durchschnitt
                widget: string
                hint: 'z. B. „4,9“ (mit Komma).'
              - name: text
                label: Text neben den Sternen
                widget: string
                hint: 'z. B. „bei über 120 Google-Bewertungen“. Das letzte Wort wird automatisch als Link unterstrichen.'
              - name: link
                label: Link zu den Bewertungen
                widget: string
                type: url
                hint: 'Google-Maps-Link, unter dem die Bewertungen zu sehen sind.'
              - name: stand
                label: Stand
                widget: string
                required: false
                hint: 'Wann Sie die Werte zuletzt geprüft haben, z. B. „Oktober 2026“.'

      # ------------------------------------------------------------------ startseite.yml
      - name: startseite
        label: Startseite (Startbild, Über uns, Kontakt)
        icon: home
        file: src/_data/startseite.yml
        preview_path: /
        fields:
          - name: seo
            label: Suchmaschinen & Teilen
            widget: object
            collapsed: true
            comment: 'Startseite: Suchmaschinen-Angaben, Startbild, Kurzfakten, „Über uns“ und Kontakt-Bereich.\nPlatzhalter wie {telefon} oder {strasse} werden automatisch aus den Praxisdaten gefüllt.'
            hint: 'Wie die Website bei Google und beim Teilen (z. B. per WhatsApp) erscheint.'
            fields:
              - name: titel
                label: Seitentitel
                widget: string
                hint: 'Erscheint im Browser-Tab und als Überschrift bei Google. Ideal: höchstens 60 Zeichen.'
              - name: beschreibung
                label: Beschreibung für Google
                widget: text
                hint: 'Ein bis zwei Sätze, ideal 120–160 Zeichen. Platzhalter wie {telefon} und {strasse} sind möglich.'
              - name: teilen_titel
                label: Titel beim Teilen
                widget: string
                required: false
                hint: 'Leer lassen = Seitentitel.'
              - name: teilen_beschreibung
                label: Beschreibung beim Teilen
                widget: text
                required: false
                hint: 'Leer lassen = Beschreibung für Google.'
              - name: teilen_bild
                label: Vorschaubild beim Teilen
                widget: image
                required: false
                choose_url: false
                hint: 'Foto im Querformat. Wird automatisch auf 1600 Pixel Breite gebracht.'
              - name: teilen_bild_alt
                label: Bildbeschreibung des Vorschaubilds
                widget: string
                required: false
          - name: hero
            label: Startbild & Begrüßung (ganz oben)
            widget: object
            fields:
              - name: eyebrow
                label: Kleine Überschrift (Computer & Tablet)
                widget: string
                hint: 'Steht in kleinen Großbuchstaben über der Hauptüberschrift.'
              - name: eyebrow_mobil
                label: Kleine Überschrift (Handy)
                widget: string
                required: false
                hint: 'Kürzere Variante für schmale Bildschirme. Leer lassen = wie oben.'
              - name: titel
                label: Hauptüberschrift
                widget: string
              - name: titel_betont
                label: Betonter Schluss der Überschrift
                widget: string
                required: false
                hint: 'Erscheint kursiv in Blau direkt hinter der Hauptüberschrift, z. B. „Ihrer Stärke.“'
              - name: text
                label: Einleitungstext
                widget: text
                required: false
                hint: 'Platzhalter wie {telefon} werden automatisch ersetzt.'
              - name: button
                label: Text des Anruf-Knopfs
                widget: string
                hint: 'Der Knopf wählt die Telefonnummer aus den Praxisdaten.'
              - name: telefon_label
                label: Beschriftung über der Telefonnummer
                widget: string
              - name: bild
                label: Startbild
                widget: image
                required: false
                choose_url: false
                hint: 'Großes Foto rechts (Computer) bzw. oben (Handy). Querformat, mindestens 1600 Pixel breit.'
              - name: bild_alt
                label: Bildbeschreibung (Alternativtext)
                widget: string
                required: false
                hint: 'Ein Satz, was auf dem Foto zu sehen ist – für blinde Menschen und Suchmaschinen.'
              - name: bild_beschriftung
                label: Schild im Foto
                widget: string
                required: false
                hint: 'Kleines Schild unten links im Foto (nicht auf dem Handy). Platzhalter wie {strasse} sind möglich. Leer lassen = kein Schild.'
              - name: bildausschnitt
                label: Bildausschnitt (für Fortgeschrittene)
                widget: string
                required: false
                hint: 'Welcher Teil des Fotos beim Zuschneiden sichtbar bleibt: object-[X%_Y%], X = von links, Y = von oben (50%_50% = Mitte). Mit „lg:“ davor gilt ein Wert nur am Computer. Leer lassen = Bildmitte; nach einem Fototausch am besten leeren.'
                pattern: ['^(?:(?:sm|md|lg|xl|2xl):)?(?:(?:object|origin)-\[\d{1,3}(?:\.\d+)?%_\d{1,3}(?:\.\d+)?%\]|object-(?:center|top|bottom|left|right|left-top|left-bottom|right-top|right-bottom)|scale-\[\d(?:\.\d{1,3})?\]|scale-(?:100|105|110|125))(?: +(?:(?:sm|md|lg|xl|2xl):)?(?:(?:object|origin)-\[\d{1,3}(?:\.\d+)?%_\d{1,3}(?:\.\d+)?%\]|object-(?:center|top|bottom|left|right|left-top|left-bottom|right-top|right-bottom)|scale-\[\d(?:\.\d{1,3})?\]|scale-(?:100|105|110|125)))*$', 'Bitte nur Angaben wie object-[50%_50%] oder lg:object-[60%_40%] verwenden, durch Leerzeichen getrennt.']
          - name: fakten
            label: Kurzfakten unter dem Startbild
            label_singular: Kurzfakt
            widget: list
            required: false
            collapsed: true
            summary: '{{titel}} – {{text}}'
            hint: 'Am schönsten mit genau 4 Einträgen (2 × 2 auf dem Handy, 4 nebeneinander am Computer).'
            fields:
              - name: icon
                label: Symbol
                widget: select
                default: check
                options:
                  - { label: Familie, value: family }
                  - { label: Ortsmarke, value: pin }
                  - { label: Ebenen (Vielfalt), value: layers }
                  - { label: Hantel (Training), value: dumbbell }
                  - { label: Haken, value: check }
                  - { label: Telefon, value: phone }
                  - { label: Uhr, value: clock }
                  - { label: Brief, value: mail }
                  - { label: Stern, value: star }
              - name: titel
                label: Titel
                widget: string
              - name: text
                label: Zusatzzeile
                widget: string
                required: false
                hint: 'Kurz halten. Platzhalter wie {strasse} sind möglich.'
          - name: willkommen
            label: Über uns
            widget: object
            fields:
              - name: eyebrow
                label: Kleine Überschrift
                widget: string
              - name: titel
                label: Überschrift
                widget: string
              - name: zitat
                label: Zitat
                widget: string
                required: false
                hint: 'Erscheint groß und kursiv unter der Überschrift. Anführungszeichen bitte selbst setzen („…“).'
              - name: text
                label: Text
                widget: markdown
                required: false
                buttons: [bold, italic]
                hint: 'Absätze mit einer Leerzeile trennen. Platzhalter wie {telefon} werden automatisch ersetzt.'
              - name: unterschrift
                label: Unterschrift
                widget: string
                required: false
                hint: 'z. B. „Ihr Team der Physiotherapie Kemper“.'
              - name: bild
                label: Großes Foto
                widget: image
                required: false
                choose_url: false
                hint: 'Wird am Computer hochkant (4:5), auf dem Handy quer (4:3) zugeschnitten.'
              - name: bild_alt
                label: Bildbeschreibung großes Foto
                widget: string
                required: false
              - name: bildausschnitt
                label: Bildausschnitt großes Foto (für Fortgeschrittene)
                widget: string
                required: false
                hint: 'Welcher Teil des Fotos beim Zuschneiden sichtbar bleibt: object-[X%_Y%], X = von links, Y = von oben (50%_50% = Mitte). Mit „lg:“ davor gilt ein Wert nur am Computer. Leer lassen = Bildmitte; nach einem Fototausch am besten leeren.'
                pattern: ['^(?:(?:sm|md|lg|xl|2xl):)?(?:(?:object|origin)-\[\d{1,3}(?:\.\d+)?%_\d{1,3}(?:\.\d+)?%\]|object-(?:center|top|bottom|left|right|left-top|left-bottom|right-top|right-bottom)|scale-\[\d(?:\.\d{1,3})?\]|scale-(?:100|105|110|125))(?: +(?:(?:sm|md|lg|xl|2xl):)?(?:(?:object|origin)-\[\d{1,3}(?:\.\d+)?%_\d{1,3}(?:\.\d+)?%\]|object-(?:center|top|bottom|left|right|left-top|left-bottom|right-top|right-bottom)|scale-\[\d(?:\.\d{1,3})?\]|scale-(?:100|105|110|125)))*$', 'Bitte nur Angaben wie object-[50%_50%] oder lg:object-[60%_40%] verwenden, durch Leerzeichen getrennt.']
              - name: bild_klein
                label: Kleines Detailfoto
                widget: image
                required: false
                choose_url: false
                hint: 'Quadratischer Ausschnitt, der unten rechts über dem großen Foto liegt. Am besten ein quadratisches Foto verwenden.'
              - name: bild_klein_alt
                label: Bildbeschreibung Detailfoto
                widget: string
                required: false
              - name: bildunterschrift
                label: Bildunterschrift
                widget: string
                required: false
          - name: kontakt
            label: Kontakt & Anfahrt
            widget: object
            hint: 'Adresse, Telefon, Fax, E-Mail und Öffnungszeiten kommen automatisch aus den Praxisdaten.'
            fields:
              - name: eyebrow
                label: Kleine Überschrift
                widget: string
              - name: titel
                label: Überschrift
                widget: string
              - name: text
                label: Einleitungstext
                widget: text
                required: false
                hint: 'Platzhalter wie {strasse_lang} oder {lage} werden automatisch ersetzt.'
              - name: button_anrufen
                label: Text des Anruf-Knopfs
                widget: string
              - name: button_route
                label: Text des Route-Knopfs
                widget: string
                hint: 'z. B. „Route planen“. Derselbe Text erscheint auch als Link, wo in einem Text der Platzhalter {route} steht (z. B. bei den häufigen Fragen).'
              - name: route_hinweis
                label: Hinweis unter den Knöpfen
                widget: string
                required: false
              - name: termine_titel
                label: Überschrift „Termine“
                widget: string
              - name: termine_text
                label: Text „Termine“
                widget: string
                hint: 'z. B. „Nach Vereinbarung“. Ändern sich Ihre Terminregeln, passen Sie auch den „Einleitungstext“ oben, in den Praxisdaten den „Hinweis unter den Öffnungszeiten“ und bei den häufigen Fragen „Wann ist die Praxis geöffnet?“ an.'
              - name: termine_zusatz
                label: Zusatz „Termine“
                widget: string
                required: false
              - name: bild
                label: Foto
                widget: image
                required: false
                choose_url: false
                hint: 'Am besten die Außenansicht, damit man die Praxis wiedererkennt.'
              - name: bild_alt
                label: Bildbeschreibung
                widget: string
                required: false
              - name: bildausschnitt
                label: Bildausschnitt (für Fortgeschrittene)
                widget: string
                required: false
                hint: 'Welcher Teil des Fotos beim Zuschneiden sichtbar bleibt: object-[X%_Y%], X = von links, Y = von oben (50%_50% = Mitte). Mit „lg:“ davor gilt ein Wert nur am Computer. Leer lassen = Bildmitte; nach einem Fototausch am besten leeren.'
                pattern: ['^(?:(?:sm|md|lg|xl|2xl):)?(?:(?:object|origin)-\[\d{1,3}(?:\.\d+)?%_\d{1,3}(?:\.\d+)?%\]|object-(?:center|top|bottom|left|right|left-top|left-bottom|right-top|right-bottom)|scale-\[\d(?:\.\d{1,3})?\]|scale-(?:100|105|110|125))(?: +(?:(?:sm|md|lg|xl|2xl):)?(?:(?:object|origin)-\[\d{1,3}(?:\.\d+)?%_\d{1,3}(?:\.\d+)?%\]|object-(?:center|top|bottom|left|right|left-top|left-bottom|right-top|right-bottom)|scale-\[\d(?:\.\d{1,3})?\]|scale-(?:100|105|110|125)))*$', 'Bitte nur Angaben wie object-[50%_50%] oder lg:object-[60%_40%] verwenden, durch Leerzeichen getrennt.']
              - name: bild_hinweis_titel
                label: Hinweis im Foto – fetter Anfang
                widget: string
                required: false
                hint: 'z. B. „So finden Sie uns:“'
              - name: bild_hinweis
                label: Hinweis im Foto – Text
                widget: string
                required: false
                hint: 'Weißes Kärtchen unten im Foto. Leer lassen = kein Kärtchen.'

      # ------------------------------------------------------------------ leistungen.yml
      - name: leistungen
        label: Leistungen
        icon: medical_services
        file: src/_data/leistungen.yml
        preview_path: /#leistungen
        fields:
          - name: eyebrow
            label: Kleine Überschrift
            widget: string
            comment: 'Leistungen: Einleitung, Leistungsbereiche mit ihren einzelnen Leistungen und der Beratungs-Hinweis.\nEin senkrechter Strich | im Namen eines Bereichs markiert, wo ein langes Wort in der Überschrift getrennt werden darf (z. B. „Lymph|drainage“). Auf der Website ist der Strich nicht zu sehen.'
          - name: titel
            label: Überschrift
            widget: string
          - name: intro
            label: Einleitungstext
            widget: text
            required: false
          - name: gruppen
            label: Leistungsbereiche
            label_singular: Leistungsbereich
            widget: list
            required: false
            collapsed: true
            summary: '{{titel}}'
            thumbnail: bild
            hint: 'Am Computer stehen bis zu 4 Bereiche nebeneinander in der Übersicht. Liste leeren = Bereich „Leistungen“ wird ausgeblendet.'
            fields:
              - name: titel
                label: Name des Bereichs
                widget: string
                hint: 'Aus dem Namen wird auch die Sprungmarke gebildet (#bereich-…). Ein senkrechter Strich | markiert, wo ein langes Wort in der großen Überschrift getrennt werden darf, z. B. „Massage & Lymph|drainage“. Auf der Website ist der Strich unsichtbar; das Wort wird nur bei Platzmangel mit Bindestrich getrennt.'
              - name: kurzuebersicht
                label: Stichworte für die Übersicht (Computer)
                widget: string
                required: false
                hint: 'Kurze Stichworte, getrennt mit „ · “, z. B. „KG · KG an Geräten · Atemtherapie“. Leer lassen = alle Leistungen werden automatisch aufgezählt. Bitte anpassen, wenn Sie Leistungen umbenennen, hinzufügen oder entfernen.'
              - name: uebersicht
                label: Aufzählung der Leistungen (Handy)
                widget: string
                required: false
                hint: 'Kommagetrennte Aufzählung unter dem Bereichsnamen auf dem Handy. Leer lassen = automatisch aus den Leistungen. Bitte anpassen, wenn sich die Leistungen ändern.'
              - name: text
                label: Beschreibung des Bereichs
                widget: text
                required: false
                hint: 'Platzhalter wie {telefon} werden automatisch ersetzt.'
              - name: bild
