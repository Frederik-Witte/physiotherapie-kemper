  link_text: Das ganze Team kennenlernen

# Eigene Seite „Unser Team“ (/team.html)
seite:
  seo_titel: Unser Team – Physiotherapie Kemper
  seo_beschreibung: "Die Menschen hinter der Physiotherapie Kemper in Hannover-Stöcken: die Inhaber Dirk, Björn und Yannick Kemper und ihr Team aus Therapie, Empfang und Verwaltung."
  eyebrow: Unser Team
  titel: Die Menschen hinter
  titel_betont: Ihrer Therapie.
  intro: "Die Physiotherapie Kemper ist ein Familienbetrieb: Dirk Kemper führt die Praxis gemeinsam mit seinen Söhnen Björn und Yannick. Zusammen mit unserem Team aus Therapie, Empfang und Verwaltung sind wir für Sie da – mit einem Grundsatz, der uns seit vielen Jahren begleitet:"
  zitat: „Der Mensch steht im Mittelpunkt.“
  bild: /assets/bilder/aussenansicht.jpg
  bild_alt: "Schaufenster der Praxis am Stöckener Markt mit der Aufschrift „Krankengymnastik – Dirk Kemper & Söhne“"
  bildausschnitt: object-[84%_40%] lg:object-[80%_45%]
  inhaber_titel: Die Inhaber
  inhaber_text: Vater und Söhne führen die Praxis gemeinsam.
  team_titel: Unser Praxisteam
  team_text: Vom ersten Anruf bis zur Behandlung – diese Menschen sind in unserer Praxis für Sie da.
  anruf_titel: Wir freuen uns darauf, Sie kennenzulernen.
  anruf_text: Rufen Sie uns an – wir beraten Sie gern und vereinbaren einen Termin mit Ihnen.

