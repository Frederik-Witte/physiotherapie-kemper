willkommen:
  eyebrow: Über uns
  titel: Ein Familienbetrieb, mitten in Stöcken.
  zitat: "„Wir sind die Physiotherapie in Hannover-Stöcken – seit vielen Jahren.“"
  text: |-
    Hinter der Physiotherapie Kemper steht eine Familie: Dirk Kemper und seine Söhne. In unseren modernen Räumen am Stöckener Markt bieten wir Ihnen ein umfangreiches Leistungsspektrum – von der Krankengymnastik über die Manuelle Therapie bis zur Lymphdrainage.

    Ob Rehabilitation oder Vorbeugung: Wir kümmern uns mit größtmöglicher Sorgfalt um Ihre Beschwerden. Gerne begleiten wir Sie auf Ihrem Weg durch die Physiotherapie – und freuen uns darauf, Sie persönlich kennenzulernen.
  unterschrift: Ihr Team der Physiotherapie Kemper
  bild: /assets/bilder/training-licht.jpg
  bild_alt: Orchideen vor einem großen, hellen Milchglasfenster im Trainingsbereich
  bildausschnitt: object-[18%_60%] lg:object-[14%_50%]
