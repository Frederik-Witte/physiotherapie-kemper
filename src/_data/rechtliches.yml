      text: Wenn Sie uns anrufen oder eine E-Mail schreiben, verwenden wir Ihre Angaben nur, um Ihr Anliegen zu bearbeiten.
    - titel: Links zu anderen Anbietern
      text: „Route planen“ und die Google-Bewertungen führen zu Google Maps, der Facebook-Link zu Facebook. Erst wenn Sie einen dieser Links anklicken, öffnet sich die Seite des Anbieters in einem neuen Fenster. Dort gelten die Datenschutzbestimmungen des jeweiligen Anbieters.
